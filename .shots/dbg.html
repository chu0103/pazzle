<!DOCTYPE html><html><body style="margin:0">
<div id="stage" style="width:390px;height:844px"></div>
<div id="out">init</div>
<script src="../js/core/ns.js"></script>
<script src="../js/core/palette.js"></script>
<script src="../js/core/draw.js"></script>
<script src="../js/platform/browser.js"></script>
<script src="../js/core/save.js"></script>
<script src="../js/game/generator.js"></script>
<script src="../js/game/model.js"></script>
<script src="../js/scenes/home.js"></script>
<script src="../js/scenes/levels.js"></script>
<script src="../js/scenes/play.js"></script>
<script src="../js/app.js"></script>
<script>
var info=[];
try{
  info.push('BF='+!!window.BF);
  info.push('platformW='+(window.BF&&BF.platform?BF.platform.width:'-'));
  info.push('scene='+(window.BF&&BF.App&&BF.App.current?BF.App.current.constructor.name:'-'));
  info.push('canvas='+(BF.platform.canvas.width+'x'+BF.platform.canvas.height));
  var c=BF.platform.ctx;
  var d=c.getImageData(0,0,1,1).data;
  info.push('px(0,0)='+d[0]+','+d[1]+','+d[2]+','+d[3]);
  info.push('err='+BF.App.err);
}catch(e){ info.push('EX:'+e.message); }
setTimeout(function(){ document.getElementById('out').textContent = 'DIAG|'+info.join('|'); }, 1200);
</script></body></html>
